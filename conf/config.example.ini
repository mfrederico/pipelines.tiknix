; Pipeline Editor — a sidecar plugin on the Sidecar Kit (copy to config.ini; gitignored).
; Reads/writes pipeline FILES in the instances you own, and runs them via each
; instance's own trigger endpoint. Reuses core's vendor + shared classes (incl.
; lib/Pipeline/* and lib/Sidecar/*).

[app]
name = "Pipeline Editor"
baseurl = "https://pipelines.tiknix.com"
session_name = "PIPELINES_SESSION"
debug = false
builder_tools_enabled = false

[database]
type = "sqlite"
path = "data/pipelines.db"

[sidecar]
name       = "pipelines"
feature    = "pipelines"
landing    = "/edit"
core_root  = "/var/www/html/default/tiknix"
core_url   = "https://tiknix.com"
sso_secret = ""
